
<div class="pagina-cadastro">

  <header class="topo-cadastro">
    <div class="logo-box">
      <div class="icone-logo">🎓</div>
      <div class="texto-logo">
        <h2>UNIFIO</h2>
        <span>ACHADOS E PERDIDOS</span>
      </div>
    </div>
  </header>

  <main class="conteudo-cadastro">
    <section class="formulario-cadastro">

      <h1>CADASTRO</h1>

      <p class="subtitulo">
        Informe os dados solicitados para realizar cadastro
      </p>

      <form (submit)="$event.preventDefault()">

        <div class="campo">
          <label for="nome">Nome de Usuário<span>*</span></label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome de Usuário"
            required
          >
        </div>

        <div class="campo">
          <label for="email">E-Mail institucional<span>*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@unifio.edu.br"
            required
          >
        </div>

        <div class="campo">
          <label for="senha">Senha<span>*</span></label>

          <div class="senha-container">
            <input
              [type]="mostrarSenha ? 'text' : 'password'"
              id="senha"
              name="senha"
              placeholder="Digite a sua senha"
              required
            >

            <button
              type="button"
              class="botao-olho"
              aria-label="Mostrar ou ocultar senha"
              (click)="mostrarSenha = !mostrarSenha"
            >
              {{ mostrarSenha ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirme sua senha<span>*</span></label>

          <div class="senha-container">
            <input
              [type]="mostrarConfimacaoSenha ? 'text' : 'password'"
              id="confirmarSenha"
              name="confirmarSenha"
              placeholder="Digite a sua senha"
              required
            >

            <button
              type="button"
              class="botao-olho"
              aria-label="Mostrar ou ocultar confirmação da senha"
              (click)="mostrarConfimacaoSenha = !mostrarConfimacaoSenha"
            >
              {{ mostrarConfimacaoSenha ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <div class="acoes-cadastro">
          <button type="submit" class="botao-criar">
            Efetuar Cadastro
          </button>

          <div class="link-login">
            <span>Já possui Login?</span>
            <a routerLink="/entrada/login">LOGIN</a>
          </div>
        </div>

      </form>

    </section>
  </main>

</div>
