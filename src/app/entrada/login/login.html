
<div class="pagina-login">

  <div class="painel-login">

    <header class="cabecalho">
      <div class="logo">🎓</div>

      <div>
        <span>UNIFIO</span>
        <p>ACHADOS E PERDIDOS</p>
      </div>
    </header>

    <main class="conteudo-login">

      <h2>LOGIN</h2>

      <p>Utilize seus dados de estudante para efetuar login.</p>

      <form (ngSubmit)="entrar()">

        <mat-form-field appearance="outline">
          <mat-label>E-mail institucional</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            [(ngModel)]="senha"
            required
          />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit">
          Entrar
        </button>

        <p *ngIf="mensagem">{{ mensagem }}</p>

      </form>

    </main>

  </div>

</div>
